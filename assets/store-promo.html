<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quipendo store promo tiles</title>
    <style>
      /* Open as store-promo.html?tile (440x280) or store-promo.html?marquee (1400x560). */
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      body {
        position: relative;
        width: 440px;
        height: 280px;
        font-family: 'Avenir Next', 'Helvetica Neue', system-ui, sans-serif;
        color: #fff;
        background:
          radial-gradient(60% 90% at 22% 52%, rgba(139, 92, 246, 0.55), transparent 68%),
          radial-gradient(50% 80% at 100% 100%, rgba(34, 211, 238, 0.16), transparent 62%),
          linear-gradient(135deg, #1b0b47 0%, #2a1066 55%, #12072e 100%);
      }
      body.marquee {
        width: 1400px;
        height: 560px;
      }
      #stars {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .logo {
        position: absolute;
        filter: drop-shadow(0 12px 20px rgba(10, 0, 40, 0.6));
      }
      .copy {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        top: 0;
        bottom: 0;
      }
      .wordmark {
        display: block;
        align-self: flex-start;
        height: auto;
      }
      .tag {
        margin: 0;
        font-weight: 500;
        line-height: 1.25;
        color: #e8defe;
      }
      .tag b {
        font-weight: 700;
        color: #67e8f9;
      }
      .foot {
        letter-spacing: 0.03em;
        color: #b7a4ee;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
      }
      .chip {
        font-weight: 600;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #f4eeff;
      }

      /* 440 x 280 */
      body.tile .logo {
        left: 30px;
        top: 74px;
        width: 132px;
        height: 132px;
      }
      body.tile .copy {
        left: 182px;
        right: 22px;
      }
      body.tile .wordmark {
        width: 236px;
        margin-left: -4px;
      }
      body.tile .tag {
        margin-top: 10px;
        font-size: 19px;
      }
      body.tile .chips {
        gap: 6px;
        margin-top: 14px;
      }
      body.tile .chip {
        font-size: 12px;
        padding: 4px 10px;
      }
      body.tile .foot {
        margin-top: 12px;
        font-size: 12px;
      }

      /* 1400 x 560 */
      body.marquee .logo {
        left: 120px;
        top: 90px;
        width: 380px;
        height: 380px;
        filter: drop-shadow(0 30px 44px rgba(10, 0, 40, 0.6));
      }
      body.marquee .copy {
        left: 590px;
        right: 60px;
      }
      body.marquee .wordmark {
        width: 640px;
        margin-left: -8px;
      }
      body.marquee .tag {
        margin-top: 22px;
        font-size: 40px;
      }
      body.marquee .chips {
        gap: 12px;
        margin-top: 32px;
      }
      body.marquee .chip {
        font-size: 23px;
        padding: 9px 20px;
      }
      body.marquee .foot {
        margin-top: 28px;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <svg id="stars" aria-hidden="true"></svg>
    <img class="logo" src="logo.svg" alt="" />
    <div class="copy">
      <img class="wordmark" src="wordmark-on-dark.svg" alt="Quipendo" />
      <p class="tag" id="tag"></p>
      <div class="chips" id="chips"></div>
      <div class="foot" id="foot"></div>
    </div>
    <script>
      const kind = location.search === '?marquee' ? 'marquee' : 'tile';
      document.body.className = kind;
      const marquee = kind === 'marquee';
      document.getElementById('tag').innerHTML = marquee
        ? 'Save your <b>Quip</b> folders as <b>Markdown</b>.'
        : 'Your <b>Quip</b> documents, saved as <b>Markdown</b>.';
      document.getElementById('chips').innerHTML = (marquee ? ['Calendars', 'Kanban boards', 'Spreadsheets', 'Comments'] : ['Calendars', 'Boards', 'Sheets'])
        .map((text) => `<span class="chip">${text}</span>`)
        .join('');
      document.getElementById('foot').textContent = marquee ? 'Read-only \u00b7 Chrome extension + CLI \u00b7 MIT licensed' : 'Read-only \u00b7 Free';

      // A fixed seed keeps the star field identical on every render.
      const width = marquee ? 1400 : 440;
      const height = marquee ? 560 : 280;
      const stars = document.getElementById('stars');
      stars.setAttribute('viewBox', `0 0 ${width} ${height}`);
      let seed = 7;
      const next = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      for (let i = 0; i < (marquee ? 90 : 40); i += 1) {
        const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        dot.setAttribute('cx', (next() * width).toFixed(1));
        dot.setAttribute('cy', (next() * height).toFixed(1));
        dot.setAttribute('r', ((0.6 + next() * 1.6) * (marquee ? 1 : 0.7)).toFixed(2));
        dot.setAttribute('fill', '#fff');
        dot.setAttribute('opacity', (0.15 + next() * 0.5).toFixed(2));
        stars.appendChild(dot);
      }
    </script>
  </body>
</html>
