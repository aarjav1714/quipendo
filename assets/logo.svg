    <g id="star" transform="translate(406 338)">
      <circle r="124" fill="url(#glow)" class="fine"/>
      <rect x="-124" y="-1.6" width="248" height="3.2" fill="url(#flare)" class="fine"/>
      <rect x="-86" y="-1.4" width="172" height="2.8" fill="url(#flare)" transform="rotate(90)" class="fine" opacity="0.55"/>
      <use href="#spark" xlink:href="#spark" fill="url(#gold)"/>
