      <use href="#spark" xlink:href="#spark" transform="translate(104 436) scale(0.27)" fill="#67E8F9"/>
      <use href="#spark" xlink:href="#spark" transform="translate(452 164) scale(0.19)" fill="#FDE68A"/>
      <circle cx="432" cy="128" r="6" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="150" cy="468" r="4.5" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="52" cy="336" r="3.5" fill="#FFFFFF" opacity="0.5"/>
      <circle cx="300" cy="60" r="4" fill="#C4B5FD" opacity="0.8"/>
      <circle cx="448" cy="290" r="6" fill="#FDE68A" opacity="0.9"/>
