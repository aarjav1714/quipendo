<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Quipendo</title>
  <!--
    A Q that is also a smiling fish: the ring is the body (with its eye and smile), the Q's tail is the fish's tail fin,
    and a dorsal fin on top finishes the fish. The outline is one path: a ring, a forked tail and a fin joined with
    rounded corners, then fitted to 34 cubic curves. The ring's hole is the second subpath (even-odd fill).
    The face, the bubbles and the details marked class="fine" are left out of the small toolbar sizes, which use
    the bold face instead (see scripts/build-icons.mjs).
  -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#2A1066"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aqua" cx="0.08" cy="1" r="0.75">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chalk" gradientUnits="userSpaceOnUse" x1="80" y1="70" x2="440" y2="430">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6DAFF"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#1B0A45" flood-opacity="0.5"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <rect width="512" height="512" fill="url(#aqua)" class="fine"/>

    <g class="fine">
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4">
        <circle cx="432" cy="104" r="16"/>
        <circle cx="464" cy="158" r="9"/>
        <circle cx="398" cy="58" r="7"/>
      </g>
      <g fill="#FFFFFF" fill-opacity="0.7">
        <circle cx="427" cy="99" r="3.5"/>
        <circle cx="104" cy="452" r="4"/>
        <circle cx="52" cy="340" r="3"/>
      </g>
    </g>

    <g id="art" transform="translate(248 270) scale(0.92) translate(-256 -256)">
      <path id="fish" class="mark" filter="url(#lift)" fill="url(#chalk)" fill-rule="evenodd" d="M70.01 210.35C70.18 236.56 76.7 261.95 90.49 284.36C114.2 322.86 156.05 347.34 201.15 349.83C215.25 350.61 229.44 348.98 243.09 345.46C254.57 342.51 267.09 333.68 278.73 340.79C291.51 348.59 287.64 363.92 290.68 376.4C295.14 394.7 306.17 411.16 321.81 421.77C325.6 424.33 329.62 426.57 333.82 428.39C336.18 429.41 338.3 430.56 340.85 429.85C346.37 428.31 351.53 420.32 354.67 415.97C363.76 403.39 368.65 388.09 368.89 372.6C369.08 360.43 362.91 347.06 373.09 337.33C380.95 329.8 392.93 331.87 402.75 329.26C417.72 325.28 431.39 316.83 441.4 304.97C444.35 301.47 446.97 297.69 449.24 293.71C450.25 291.93 451.62 289.94 451.52 287.76C451.41 285.34 449.84 283.61 448.4 281.74C444.93 277.22 440.93 273.1 436.52 269.5C423.72 259.04 407.51 253.1 391.01 252.51C385.51 252.31 380 252.67 374.58 253.61C364.78 255.32 355.88 256.77 348.72 247.96C341.12 238.62 345.69 226.29 345.96 215.43C346.27 202.48 344.84 189.38 341.45 176.87C338.5 165.93 334.39 155.29 328.86 145.39C323.86 136.43 314.43 127.83 315.3 116.76C316.07 107.05 323.58 103.24 329.07 96.32C334.14 89.92 337 82 337.64 73.9C337.91 70.34 338.21 66.19 334.55 64.25C319.92 56.48 301.49 58.03 288.92 69.02C281.8 75.24 278.6 83.56 268.26 84.87C263.22 85.5 259.09 83.71 254.42 82.04C249.66 80.35 244.83 78.94 239.93 77.74C226.77 74.54 213.13 73.51 199.62 74.26C154.03 76.78 111.66 103.21 88.73 142.58C76.65 163.33 70.73 186.45 70.01 210.35ZM122 212A86 86 0 1 0 294 212A86 86 0 1 0 122 212Z"/>
      <g class="face-detail">
        <circle cx="172" cy="184" r="22" fill="#FFFFFF"/>
        <circle cx="167" cy="185" r="11" fill="#2A1066"/>
        <circle cx="163" cy="180" r="3.74" fill="#FFFFFF"/>
        <path d="M138 234Q188 286 246 230" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
      </g>
      <g class="face-bold" display="none">
        <circle cx="170" cy="186" r="34" fill="#FFFFFF"/>
        <circle cx="163" cy="188" r="17" fill="#2A1066"/>
        <path d="M138 234Q188 286 246 230" fill="none" stroke="#FFFFFF" stroke-width="27" stroke-linecap="round"/>
      </g>
    </g>

    <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3" class="fine"/>
  </g>
</svg>
