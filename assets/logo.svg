    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <path id="spark" d="M0 -64 Q12 -12 64 0 Q12 12 0 64 Q-12 12 -64 0 Q-12 -12 0 -64 Z"/>
  </defs>

