      <path id="tail" d="M186.0 347.2 L192.9 352.8 L199.9 358.0 L207.0 362.8 L214.2 367.3 L221.5 371.4 L228.8 375.1 L236.2 378.4 L243.7 381.4 L251.1 384.0 L258.6 386.2 L266.1 388.1 L273.6 389.5 L281.1 390.6 L288.5 391.3 L295.9 391.6 L303.2 391.6 L310.5 391.1 L317.7 390.3 L324.8 389.1 L331.8 387.6 L338.6 385.7 L345.4 383.4 L352.0 380.8 L358.4 377.9 L364.7 374.6 L370.9 371.0 L376.9 367.1 L382.8 362.9 L388.4 358.4 L394.0 353.6 L399.3 348.5 L404.6 343.1 L399.4 336.9 L393.3 340.6 L387.2 343.9 L381.1 346.8 L375.0 349.4 L369.0 351.6 L363.0 353.5 L357.0 355.0 L351.1 356.3 L345.2 357.2 L339.4 357.8 L333.6 358.2 L328.0 358.2 L322.3 358.0 L316.7 357.5 L311.2 356.7 L305.8 355.7 L300.3 354.4 L294.9 352.9 L289.6 351.2 L284.3 349.2 L279.0 346.9 L273.8 344.5 L268.5 341.8 L263.3 338.8 L258.1 335.6 L253.0 332.2 L247.8 328.6 L242.6 324.7 L237.5 320.6 L232.3 316.2 L227.2 311.6 L222.0 306.8 Z" fill="url(#chalk)" stroke="url(#chalk)" stroke-width="4" stroke-linejoin="round"/>
