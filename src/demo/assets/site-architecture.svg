    <rect x="528" y="330" width="168" height="84" rx="14" fill="#f3e8ff" stroke="#c084fc"/><text x="612" y="378" stroke="none">Search index</text>
    <rect x="768" y="330" width="168" height="84" rx="14" fill="#fee2e2" stroke="#f87171"/><text x="852" y="378" stroke="none">Database</text>
