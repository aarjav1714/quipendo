name: Release

# Push a tag such as v0.1.0 (it must match the version in package.json) to publish a release:
# the extension as a .zip (ready for "Load unpacked" or the Chrome Web Store), with checksums,
# and the command line tool to npm when an NPM_TOKEN secret exists.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release
  id-token: write # let npm record where the package was built (provenance)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: The tag must be the version being released
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version. Fix the version, then tag again." >&2
            exit 1
          fi

      - run: npm run check

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - name: Package the extension
        run: |
          zip="quipendo-extension-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r -X "../$zip" .)
          sha256sum "$zip" > SHA256SUMS.txt
          unzip -l "$zip"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "quipendo-extension-${GITHUB_REF_NAME}.zip" SHA256SUMS.txt \
            --title "Quipendo ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --provenance --access public
