name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test runner needs Node 22.12 or later.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Browser tests in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  e2e-firefox:
    name: Browser tests in Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner image has Firefox and geckodriver; Selenium Manager finds them.
      - run: npm run e2e:firefox

  lint-firefox:
    name: Firefox package lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:firefox
      - run: npx --yes web-ext@10.8.0 lint -s dist-firefox --warnings-as-errors

  safari:
    name: Safari package builds (macOS)
    runs-on: macos-latest
    # The conversion and the build below have not run anywhere yet (docs/safari.md says why). Remove this line once the job has passed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:safari
      - name: Convert it to an Xcode project
        run: |
          xcrun safari-web-extension-converter dist-safari \
            --project-location "$RUNNER_TEMP/safari" --app-name Quipendo \
            --bundle-identifier io.github.aarjav1714.quipendo \
            --macos-only --no-open --no-prompt --copy-resources
      - name: Build it without signing
        run: |
          xcodebuild -project "$RUNNER_TEMP/safari/Quipendo/Quipendo.xcodeproj" \
            -scheme "Quipendo (macOS)" -configuration Release CODE_SIGNING_ALLOWED=NO build

  # The package people install must run on every Node version it claims to support, not just the one it was built on.
  package:
    name: Installed package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination "$RUNNER_TEMP" --silent
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install the tarball in an empty project and run it
        run: |
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/quipendo-*.tgz
          npx --no-install quipendo --version
          npx --no-install quipendo --help >/dev/null
          # Asking for nothing is a mistake the tool reports with status 2, before it contacts Quip.
          status=0
          npx --no-install quipendo || status=$?
          test "$status" -eq 2
